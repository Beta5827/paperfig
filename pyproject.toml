[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paperfig"
version = "0.1.0"
description = "Publication-quality figures: editable SVG methodology diagrams and matplotlib plots (paper + 16:9 slide versions)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Jesús Betancourt Martínez" }]
license = { text = "CC-BY-NC-4.0" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
